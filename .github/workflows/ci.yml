
name: DevOps Nginx CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML file exists
        run: test -f index.html

      - name: Validate HTML content
        run: |
          grep -q "<html" index.html
          grep -q "</html>" index.html
          grep -q "DevOps" index.html

      - name: CI completed successfully
        run: echo "Nginx website validation passed!"
